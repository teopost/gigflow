name: Modifica all'app
description: Una cosa da cambiare, aggiungere o sistemare in GigFlow
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Tre campi. Il terzo è quello che di solito manca e che costringe a
        chiedere: senza, non si sa quando la modifica è finita.
        Per un appunto al volo c'è la issue vuota.

  - type: textarea
    id: cosa
    attributes:
      label: Cosa vorrei
      description: Cosa non va adesso, o cosa dovrebbe fare l'app.
      placeholder: |
        Nella lista dei palcoscenici non si capisce quali ho già contattato
        quest'anno: devo aprire la scheda uno per uno.
    validations:
      required: true

  - type: dropdown
    id: dove
    attributes:
      label: Dove
      description: La scheda da cui si vede.
      options:
        - Home
        - Palcoscenici
        - Preferiti
        - Opportunità
        - Agenda
        - Cassa
        - Bands
        - Impostazioni
        - Admin
        - Notifiche
        - Altro / più di una
    validations:
      required: true

  - type: textarea
    id: verifica
    attributes:
      label: Come faccio a vedere che è a posto
      description: Cosa tocco sul telefono, e cosa mi aspetto di vedere.
      placeholder: |
        Apro Palcoscenici: sulle righe di chi ho già contattato c'è il segno,
        sulle altre no.
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: Note
      description: Facoltativo. Foto dello schermo, urgenza, cosa avevo provato.
    validations:
      required: false
