name: New feature
description: 'Something the app doesn''t do yet'
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Il campo che conta è il secondo: quando ti serve. Una funzionalità
        senza un momento in cui la useresti di solito, una volta fatta, non
        la apre nessuno.

  - type: textarea
    id: cosa
    attributes:
      label: Cosa vorrei
      description: La cosa nuova, detta come la diresti a voce.
      placeholder: |
        Vorrei poter mandare a un locale il riepilogo delle date che gli ho
        proposto, senza riscriverle a mano su WhatsApp.
    validations:
      required: true

  - type: textarea
    id: quando
    attributes:
      label: Quando mi servirebbe
      description: Il momento vero in cui la useresti. È quello che decide la forma.
      placeholder: |
        Al telefono col gestore, mentre siamo d'accordo a voce e devo lasciargli
        qualcosa di scritto prima che si dimentichi.
    validations:
      required: true

  - type: dropdown
    id: dove
    attributes:
      label: Dove starebbe
      description: 'Se non lo sai, "Non lo so" va benissimo — è mezzo lavoro deciderlo.'
      options:
        - Non lo so
        - Home
        - Palcoscenici
        - Preferiti
        - Opportunità
        - Agenda
        - Cassa
        - Bands
        - Impostazioni
        - Admin
        - Notifiche
        - Una scheda nuova
    validations:
      required: true

  - type: textarea
    id: verifica
    attributes:
      label: Come faccio a vedere che è a posto
      description: Cosa tocco sul telefono, e cosa mi aspetto di vedere.
    validations:
      required: true
